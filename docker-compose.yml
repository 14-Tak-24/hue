version: '3.8'

services:
  # API Server
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hue:huepassword@db:5432/hue_db
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json
      - API_PORT=8000
      - API_DEBUG=False
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json:/app/tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json
      - ./logs:/app/logs
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=hue
      - POSTGRES_PASSWORD=huepassword
      - POSTGRES_DB=hue_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Frontend (if using containerized frontend)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:80"
  #   environment:
  #     - VITE_API_URL=http://localhost:8000
  #   depends_on:
  #     - api
  #   restart: unless-stopped

  # Nginx Reverse Proxy (disabled until nginx.conf is created)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf
  #     - ./deploy/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - api
  #     - frontend
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

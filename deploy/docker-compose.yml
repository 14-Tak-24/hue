version: '3.8'

services:
  tiapmaatzu-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tiapmaatzu-api
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - API_DEBUG=False
      - FIREBASE_SERVICE_ACCOUNT_KEY=/app/tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json
    volumes:
      - ../logs:/app/logs
      - ../tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json:/app/tiapmaatzu-firebase-adminsdk-fbsvc-db8f709411.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
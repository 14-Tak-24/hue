services:
  - type: web
    name: tiapmaatzu-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c deploy/gunicorn_config.py api_server:app
    envVars:
      - key: API_PORT
        value: 8000
      - key: API_DEBUG
        value: false
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false  # Set this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11
    plan: free
    autoDeploy: true